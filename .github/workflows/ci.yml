name: ci

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Бюджет из DECISIONS.md §2: приватные байты нашего процесса, не RSS (D-013).
  BUDGET_OUR_PRIVATE_MB: 40
  BUDGET_FAMILY_PRIVATE_MB: 200
  BUDGET_STARTUP_MS: 400

jobs:
  rust:
    name: Rust · test + clippy + fmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # E-1: vendor/node + vendor/sidecar нужны сборке (tauri resources) и
      # тестам node_store. pnpm здесь только ради зависимостей sidecar,
      # поэтому --ignore-scripts: нативный бинарник better-sqlite3
      # bundle-sidecar.ps1 сам качает prebuilt под pinned ABI (v137) и
      # принимает пингом — не зависим от node-gyp и node раннера.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: fetch node + bundle sidecar (E-1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/fetch-node.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/bundle-sidecar.ps1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        # -D warnings: предупреждения не должны накапливаться молча.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test (headless, без Tauri-окна)
        run: cargo test --workspace

      - name: test release profile
        # Бенчи и проверки производительности имеют смысл только в release.
        # Отдельный CARGO_TARGET_DIR (D-212): в общем target к этому шагу лежат
        # debug-артефакты предыдущего шага и восстановленный кэш прошлых
        # прогонов, а библиотека приложения ещё недавно собиралась в нескольких
        # crate-type и давала совпадающие имена выходов (cargo#6313). На
        # переиспользованном target это роняло компиляцию e2e_smoke с «multiple
        # different versions of crate tokio» при единственной версии tokio в
        # Cargo.lock, тогда как job e2e-smoke компилирует тот же таргет в release
        # с нуля и проходит. crate-type теперь один (rlib), но чистая директория
        # оставлена: шаг не должен зависеть от чужого кэша. Цена — полная сборка
        # зависимостей в release на каждом прогоне.
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target-release"
          cargo test --workspace --release

  # B-7: лицензии и известные CVE зависимостей (deny.toml в корне).
  # Отдельный job на ubuntu (D-214): cargo-deny-action — container action, а
  # контейнерные действия на Windows-раннере не работают вовсе
  # («Container action is only supported on Linux»). Пока шаги выше падали,
  # этот шаг просто не доходил до выполнения, поэтому поломка была не видна.
  # Проверке нужны только Cargo.toml, Cargo.lock и deny.toml — ни Windows, ни
  # node-вендор, ни компиляция ей не нужны.
  deny:
    name: cargo-deny · advisories + licenses + sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny (advisories, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  frontend:
    name: Frontend · test + check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: unit tests
        run: pnpm --filter swagcod-desktop test

      # F-11: coverage — АРТЕФАКТ, а не ворота (так в плане стадии). Порогов
      # здесь нет сознательно: само по себе число покрытия ничего не решает, а
      # красный job из-за «78 % вместо 80 %» учит не писать тесты, а подкручивать
      # планку. Отчёт нужен, чтобы видеть, ЧТО не покрыто.
      # Отдельный шаг, а не `test -- --coverage`, ровно поэтому: поломка
      # генератора отчёта не должна красить ворота, поэтому continue-on-error.
      - name: coverage report (артефакт, не ворота)
        continue-on-error: true
        run: pnpm --filter swagcod-desktop exec vitest run --coverage

      - name: upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/desktop/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: type check
        run: pnpm --filter swagcod-desktop check

      - name: build
        run: pnpm --filter swagcod-desktop build

      # Бюджет бандла: холодный старт зависит от размера JS, поэтому порог
      # зафиксирован в CI, а не «на глаз при ревью».
      # Ревизия 7: порог поднят 150000 → 300000 осознанно: добавлен DOMPurify
      # (санитизация markdown, безопасность важнее байтов), бандл стал
      # 263480. Ниже 300000 он не должен опускаться беспричинно и не должен
      # расти сверх: следующая зависимость такого веса требует записи в
      # DECISIONS.md, а не молчаливого сдвига порога.
      # Ревизия 12: порог поднят 300000 → 320000 без новых зависимостей:
      # в бандл вошёл наш код — файловое дерево панели Files, API окна
      # (своя рамка) и save-диалог журнала сессий; факт 301917 байт.
      # Ревизия 24: порог поднят 320000 → 325000, снова только наш код —
      # вкладка «Безопасность» (DPAPI-ключ, права сессии, журнал
      # подтверждений) и watchdog-бейдж «подозрительно тихо»; факт
      # 320703 байт. Новых зависимостей нет.
      # Ревизия 30: порог поднят 325000 → 332000, только наш код —
      # вкладка MCP (E-3: реестр серверов, статусы, форма добавления)
      # и кнопка импорта DSH-сессий (E-9) в General. Новых зависимостей
      # нет (см. DECISIONS.md D-124).
      # Ревизия 35: порог поднят 332000 → 340000, только наш код —
      # вкладка «Телеметрия» (E-8: три SVG-графика на чистых хелперах
      # charts.ts и таблица фоновых задач, отложенная с E-5) и строка
      # HTTP API (E-7) в «Безопасности». Библиотек графиков нет —
      # полилинии и бары строятся вручную (см. DECISIONS.md D-124).
      # Ревизия 36: порог поднят 340000 → 356000, только наш код —
      # вкладка «Провайдеры» (PR #1: 12 пресетов, custom-провайдер,
      # Fetch models, ключи под DPAPI). Новых зависимостей во
      # фронтенде нет (см. DECISIONS.md D-124).
      # Ревизия 39: порог поднят 356000 → 362000 — палитра команд v2
      # (F-2: 25 slash-команд, группы, скоринг, локализация) добавила
      # ~5 КБ. Внешних библиотек по-прежнему нет (D-124).
      # Ревизия 40: порог поднят 362000 → 368000 — редактор списков команд
      # (F-3: компонент CommandRules, две колонки regex-строк, строки ru/en)
      # добавил ~5 КБ; факт 361750. Внешних библиотек нет (D-124).
      # Ревизия 43: F-6 (diff в диалоге подтверждения: DiffPreview.svelte +
      # поле preview в wire-типах) добавил ~1.9 КБ, факт 367502 — порог не
      # поднимали, запас 498 байт (см. DECISIONS.md D-164).
      # Ревизия 44: порог поднят 368000 → 380000, только наш код — вкладка
      # «Память» (F-7: MemoryTab.svelte, две области, строки ru/en) и
      # diff-preview F-6 вместе дали факт 374353. Подъём заложен заранее
      # (D-164), внешних библиотек по-прежнему нет (D-124).
      # Ревизия 45: порог поднят 380000 → 400000 — редактор хуков (F-8:
      # HooksEditor.svelte, JSON-текст, счётчики событий, строки ru/en)
      # добавил ~5.4 КБ, факт 379733. Внешних библиотек нет (D-124).
      # Ревизия 54: порог поднят 400000 → 420000 — Фича 2 (folder-scoped
      # rules + auto-cleanup) добавила в SettingsTabs две подсекции: редактор
      # глобальных glob-правил с проверкой паттерна, редактор
      # .swagcod/rules.json рабочей папки (8 полей) и read-only предпросмотр
      # резолва всего дерева с источниками, плюс блок Maintenance с тремя
      # пределами, glob-исключениями и кнопкой ручного прогона. Факт 414243,
      # дельта +17087 к rev53. Контроль дрейфа: baseline-сборка с откаченными
      # двумя файлами UI даёт ровно 397156, то есть весь рост — наш код, а не
      # зависимости. Внешних библиотек по-прежнему нет (D-124), новых
      # CSS-классов три (.settings-area, .rules-grid, .rules-input), остальное
      # существующее. CSS в гейт не входит (D-205).
      - name: bundle size budget
        shell: bash
        run: |
          set -e
          LIMIT=420000
          TOTAL=0
          for f in apps/desktop/dist/assets/*.js; do
            SIZE=$(stat -c%s "$f")
            TOTAL=$((TOTAL + SIZE))
          done
          echo "JS bundle total: $TOTAL bytes (limit $LIMIT)"
          if [ "$TOTAL" -gt "$LIMIT" ]; then
            echo "::error::Бандл JS вырос сверх бюджета ($TOTAL > $LIMIT байт)"
            exit 1
          fi

  # F-11: сквозная проверка хода. Провайдер подменяется встроенным эхом по
  # env-флагу SWAGCOD_ECHO_PROVIDER (паттерн fake-mcp: подделка живёт в
  # репозитории, сети и ключей не требует), поэтому job проверяет ВЕСЬ путь —
  # loopback HTTP API, драйвер хода, машину хода, шину событий, store и счёт
  # токенов, — а не упирается в границу с сетью, где в CI всё равно никого нет.
  # Профиль release: проверяем ту сборку, которую отдаём пользователю.
  # Собранный .exe здесь сознательно не запускается: нужны WebView2 и оконная
  # сессия, которых на headless-раннере нет (та же причина, по которой в CI нет
  # бенчей старта, — см. комментарий внизу файла и D-013).
  e2e-smoke:
    name: E2E smoke · ход через HTTP API (echo-провайдер)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # vendor/node и vendor/sidecar нужны самому AppState: состояние
      # приложения поднимает node-sidecar даже при in-memory базе (в выводе
      # теста это строки «store-sidecar: готов»). Без них smoke проверил бы не
      # ту сборку, что уходит в релиз.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: fetch node + bundle sidecar (E-1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/fetch-node.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/bundle-sidecar.ps1

      - name: Cache cargo (release)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Отдельный ключ от job `rust`: тот кэширует debug-артефакты, а здесь
          # нужен release. Общий ключ означал бы холодную сборку зависимостей
          # на каждом прогоне.
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: сквозной ход (release, echo-провайдер)
        # --nocapture: при падении видно, до какого события дошла лента.
        run: cargo test --release -p swagcod-app --test e2e_smoke -- --nocapture

  # Замеры старта и памяти требуют GUI и WebView2, поэтому гоняются локально:
  #   powershell -NoProfile -ExecutionPolicy Bypass -File tools/bench-startup.ps1 -OutFile bench-out/startup.json
  # В bench-out/ коммитится только startup.json (числа бюджета для README);
  # скриншоты и пробы игнорируются как двоичный шум.
  # В CI их нет: headless-раннер не поднимет WebView2, а число получилось бы
  # нерепрезентативным и создавало ложное ощущение контроля над бюджетом.
  # Бюджеты старта и private bytes скрипт читает из env-переменных выше
  # (BUDGET_STARTUP_MS, BUDGET_OUR_PRIVATE_MB, BUDGET_FAMILY_PRIVATE_MB).
