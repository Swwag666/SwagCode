[package]
name = "swagcod-app"
description = "SwagCod — тонкая Tauri-обёртка над core (D-011). Вся логика в крейтах, здесь только окна и IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "swagcod_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
swagcod-core.workspace = true
swagcod-provider.workspace = true
swagcod-pty.workspace = true
swagcod-fsx.workspace = true
dotenvy = "0.15"
tauri-plugin-dialog = "2.0.0-rc.8"
