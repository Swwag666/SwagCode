[package]
name = "swagcod-app"
description = "SwagCod — тонкая Tauri-обёртка над core (D-011). Вся логика в крейтах, здесь только окна и IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "swagcod_app_lib"
# Только rlib (D-212). staticlib и cdylib здесь не нужны: exe линкуется из rlib,
# мобильных таргетов в проекте нет (crates/app/gen/schemas — только desktop и
# windows), а на MSVC несколько crate-type дают совпадающие имена выходов
# (swagcod_app_lib.lib у staticlib и импорт-библиотека cdylib, общий .pdb —
# cargo#6313). Коллизия имён в переиспользованном target ломала компиляцию
# e2e_smoke в release: rustc линковал тест против двух наборов артефактов одного
# пакета и рапортовал «multiple different versions of crate tokio».
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# Автообновление по схеме DSH Phone: updater читает latest.json из GitHub
# Releases, подпись minisign обязательна; process — надёжный перезапуск
# после установки (request_restart идёт через RunEvent::Exit).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
thiserror.workspace = true
swagcod-core.workspace = true
swagcod-provider.workspace = true
glob.workspace = true
# Фича 2: allow/deny из .swagcod/rules.json — те же regex, что core::rules
# собирает для хода. Валидируем синтаксис до записи файла на диск.
regex.workspace = true
swagcod-pty.workspace = true
swagcod-fsx.workspace = true
dotenvy = "0.15"
# Hot-reload: файловый watcher для MCP-конфигурации, JS-плагинов и скиллов.
notify = "8"
tauri-plugin-dialog = "2.0.0-rc.8"
# E-9: сессии DSH лежат в многокадровом zstd (session.v3.jsonl.zstd).
# Статическая libzstd из zstd-sys — внешних зависимостей не добавляет.
zstd = "0.13"

# Звуковые уведомления: rodio декодирует WAV/MP3/OGG и играет через WASAPI.
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"] }

# B-7: DPAPI (CryptProtectData) — ключ провайдера опционально хранится
# зашифрованным под учётной записью Windows. Только на Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }

[dev-dependencies]
tempfile = "3"
