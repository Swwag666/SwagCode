[package]
name = "swagcod-fsx"
description = "Файловые операции, watch, поиск, diff. Этап 2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
walkdir = "2"
notify = "6"
similar = "2"
ignore = "0.4"
# B-4: fuzzy-матчер из экосистемы helix/nucleo — быстрый и без зависимостей.
nucleo-matcher = "0.3"
# B-5: grep (regex), glob-матчер и fetch_url (HTML→текст через scraper).
regex = "1"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.20"

[dev-dependencies]
# F-4: сквозные тесты web_search поднимают mock-сервер на TcpListener,
# поэтому net/time/io-util явно (reqwest их и так тянет, но тест не должен
# зависеть от чужих фич).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
