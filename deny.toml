# cargo-deny (этап B-7): лицензии и известные CVE зависимостей.
# Проверка в CI шагом cargo-deny-action; локально: `cargo deny check`.

[graph]
# fuzz-крейт на libfuzzer — не часть основного workspace, проверяем только его.
exclude = ["swagcod-fuzz"]

[advisories]
# yanked-крейты — предупреждение: мгновенный deny ломал бы сборку из-за
# чужого отзыва версии без пути отката.
yanked = "warn"
ignore = [
    # `serial` не поддерживается, но это транзитив portable-pty 0.8 (D-060:
    # осознанный выбор PTY-слоя). Безопасного апгрейда нет, портативный
    # терминал на Windows работает через ConPTY, а не через serial.
    # Пересмотреть при переходе portable-pty на 0.9+.
    "RUSTSEC-2017-0008",
    # gtk-rs 0.18 (glib, gtk): транзитивы tauri только для Linux-сборки.
    # Мы собираем и ставим Windows-бинарник (WebView2), gtk-код в него не
    # компилируется вовсе; безопасного апгрейда нет. Пересмотреть при выходе
    # tauri на gtk-rs 0.20+ или при старте Linux-сборки.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2025-0057",
    # serde_yaml 0.9 помечен deprecated, а его unsafe-libyaml — не
    # поддерживается (репозиторий dtolnay/unsafe-libyaml в архиве с 2024-03).
    # Форки не лечат: serde_yaml_ng тянет тот же unsafe-libyaml, а saphyr —
    # другой API и другая семантика чисел/якорей. YAML у нас — только ИМПОРТ
    # экспортов DSH, которые пользователь сам выбирает файлом (dsh_import.rs,
    # 21 обращение, всё чтение своего файла, не сеть). Апстрим-фикса нет и не
    # будет; пересмотреть при переходе импорта на saphyr/serde-saphyr.
    "RUSTSEC-2024-0449",
    # zvariant 5.15.0 и zbus_names 4.3.4 помечены unmaintained
    # (RUSTSEC-2026-0370, RUSTSEC-2026-0371): оба влиты в zbus 6+ как модули.
    # Транзитивы tauri-plugin-single-instance 2.5.2 → zbus 5.19.0; безопасного
    # апгрейда нет (zbus 6 ломает API, плагин требует zbus ^5), та же семья,
    # что уже разрешённый RUSTSEC-2026-0372. D-Bus нужен плагину только на
    # Linux: наш Windows-бинарник эти пути не исполняет. Пересмотреть при
    # выходе tauri-plugin-single-instance на zbus 6+.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    # zip 4.6.1 приходит транзитивом tauri-plugin-updater (optional, только
    # cfg(target_os = "windows")) — распаковка артефакта обновления .nsis.zip.
    # Лечение по advisories — zip >= 9, но даже свежий tauri-plugin-updater
    # 2.14.0 требует `zip = "^4"`: безопасного апгрейда в цепочке НЕТ
    # (проверено `cargo update -p zip --dry-run` — «0 packages», и манифестом
    # 2.14.0 с crates.io). Все три advisory про распаковку ВРАЖЕСКОГО архива:
    # SUID/SGID-биты и sticky на Unix, symlink-таргеты наружу каталога
    # назначения, права через symlink. Наш архив (а) скачивается с releases
    # своего же репозитория, (б) до распаковки проверяется подписью minisign
    # (updater_builder + ключ в ~/.swagcod-updater, rev37), (в) Windows-сборка:
    # SUID/SGID и Unix-режим прав на NTFS не применяются вовсе. Пересмотреть,
    # когда tauri-plugin-updater перейдёт на zip 9+.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # zvariant_derive 5.15.0 помечен unmaintained (RUSTSEC-2026-0372).
    # Транзитив tauri-plugin-single-instance → zbus 5 → zvariant.
    # Безопасного апгрейда нет: zbus 6+ ломает API, tauri-plugin-single-instance
    # 2.5.2 требует zbus ^5. Пересмотреть при выходе tauri-plugin-single-instance
    # на zbus 6+.
    "RUSTSEC-2026-0372",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[bans]
# Дубли версий в большом дереве зависимостей неизбежны (syn, windows-sys):
# warn даёт сигнал без красно-зелёных качелей CI на каждом чихе экосистемы.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
