packages:
  - 'apps/*'
  - 'sidecar'

# pnpm 10+ не запускает build-скрипты зависимостей без явного разрешения.
# esbuild нужен vite: его postinstall ставит нативный бинарник esbuild.exe.
# better-sqlite3 — хранилище sidecar'а (ревизия 25): его install качает
# prebuilt-бинарник под текущий Node.
# В pnpm 11 ключ — allowBuilds (onlyBuiltDependencies больше не читается).
allowBuilds:
  esbuild: true
  better-sqlite3: true
